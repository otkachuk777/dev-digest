# Agent evals (tool tier) on OpenRouter. Runs only the agents a PR touched
# that have real (non-TODO) evals; everything else is printed as SKIP. Report-only: never blocks
# the merge.
#
# Model switch: Actions → eval-agents → Run workflow (inputs), or repo variables
# EVAL_AGENTS_MODEL / EVAL_JUDGE_MODEL. Needs the OPENROUTER_API_KEY repo secret.
name: eval-agents

on:
  pull_request:
    paths:
      - '.claude/agents/**'
      - 'evals/agents/**'
      - 'evals/src/**'
      - 'evals/scripts/ci-detect*'
      - '.github/workflows/eval-agents.yml'
  workflow_dispatch:
    inputs:
      model:
        description: 'Model under test (OpenRouter slug); empty = anthropic/claude-haiku-5.5'
        default: ''
      judge_model:
        description: 'LLM judge (OpenRouter slug); empty = anthropic/claude-haiku-5.5'
        default: ''
      benchmark:
        description: 'Also run a no-agent baseline and report the lift (~2x cost)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: eval-agents-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # OPENROUTER_API_KEY is set per step (key check, proxy, model runs) — never on pnpm install.
  EVAL_BACKEND: openrouter
  EVAL_MODEL: ${{ inputs.model || vars.EVAL_AGENTS_MODEL || 'anthropic/claude-haiku-5.5' }}
  EVAL_JUDGE_MODEL: ${{ inputs.judge_model || vars.EVAL_JUDGE_MODEL || 'anthropic/claude-haiku-5.5' }}
  EVAL_MAX_TURNS: 6

jobs:
  detect:
    name: Detect changed agents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agents: ${{ steps.detect.outputs.agents }}
      has_key: ${{ steps.key.outputs.has_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A new push to an open PR evaluates only the commits it added (`before..head`), so a
      # docs-only push skips the model jobs. opened/reopened, and force-pushes where `before` is
      # gone or not an ancestor, fall back to the whole PR diff.
      - id: detect
        env:
          EVAL_ALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            FROM="$PR_BASE"
            if [ "$ACTION" = "synchronize" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               && git merge-base --is-ancestor "$BEFORE" "$PR_HEAD"; then
              FROM="$BEFORE"
            fi
            echo "diff range: $FROM..$PR_HEAD"
            CHANGED_FILES="$(git diff --name-only "$FROM" "$PR_HEAD")"
            export CHANGED_FILES
          fi
          node evals/scripts/ci-detect.mjs

      - id: key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then echo "has_key=true" >> "$GITHUB_OUTPUT"
          else echo "has_key=false" >> "$GITHUB_OUTPUT"; echo "SKIP all agent evals (no OPENROUTER_API_KEY secret)"; fi

      - name: Summary
        env:
          RUN: ${{ steps.detect.outputs.agents }}
          SKIPPED: ${{ steps.detect.outputs.skipped_agents }}
        run: |
          {
            echo "## eval-agents"
            echo "- model: \`$EVAL_MODEL\` · judge: \`$EVAL_JUDGE_MODEL\`"
            echo "- run: \`$RUN\`"
            for n in $SKIPPED; do echo "- SKIP \`$n\` (no evals / only TODO stubs)"; done
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Eval quality (no model)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm eval:quality
      - run: node scripts/ci-detect.test.mjs

  agent:
    name: Agent eval (${{ matrix.agent }})
    needs: [detect, quality]
    if: needs.detect.outputs.agents != '[]' && needs.detect.outputs.has_key == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1 # OpenRouter rate-limits parallel sessions into flaky 1-turn runs
      matrix:
        agent: ${{ fromJson(needs.detect.outputs.agents) }}
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: evals/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The Agent SDK speaks only Anthropic /v1/messages. OpenRouter serves that natively for
      # anthropic/* models; any other model needs the local LiteLLM translating proxy
      # (evals/proxy/litellm.config.yaml), which every tier — judge included — then goes through.
      - name: Start LiteLLM proxy (non-Anthropic model only)
        if: ${{ !startsWith(env.EVAL_MODEL, 'anthropic/') }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          pnpm proxy:up
          echo "OPENROUTER_BASE_URL=http://localhost:4000" >> "$GITHUB_ENV"

      # Trailing slash: a bare vitest filter would also match sibling folders sharing the prefix.
      - if: ${{ !inputs.benchmark }}
        env:
          AGENT: "${{ matrix.agent }}"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm exec vitest run "agents/$AGENT/"
      - if: ${{ inputs.benchmark }}
        env:
          AGENT: "${{ matrix.agent }}"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm eval:benchmark "agents/$AGENT/" -n 1

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-agent-${{ matrix.agent }}
          path: evals/results
          if-no-files-found: ignore
      - if: failure() && !startsWith(env.EVAL_MODEL, 'anthropic/')
        # compose interpolates OPENROUTER_API_KEY even for logs; the value is unused here.
        run: OPENROUTER_API_KEY=unused docker compose -f proxy/docker-compose.yml logs --tail 100
      - if: always() && !startsWith(env.EVAL_MODEL, 'anthropic/')
        run: pnpm proxy:down
